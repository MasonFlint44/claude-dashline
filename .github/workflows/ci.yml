name: ci
on:
  push:
    branches: [main, windows]  # windows: WIP, drop before merging
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to the same PR cancels the older run. On main each commit gets its own
  # group, so no run there is cancelled, not even one still waiting to start.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --locked ruff format --check
      - run: uv run --locked ruff check
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --locked python scripts/preview.py --check
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked pytest
  apple-python:
    # The Python most Macs have: Apple's /usr/bin/python3 from the command-line tools
    # (3.9, built against LibreSSL), not the one uv installs for the tests.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: smoke test
        run: |
          if ! /usr/bin/python3 -c 'import sys; assert sys.version_info >= (3, 9)' 2>/dev/null
          then
            echo "::notice::no usable /usr/bin/python3 on this runner; skipped"
            exit 0
          fi
          scripts/smoke.sh /usr/bin/python3
  oldest-python:
    # The test suite needs 3.10 (pytest has dropped 3.9); dashline itself still runs on
    # 3.9, and this checks it does, whatever Python Apple ships.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install 3.9
      - run: scripts/smoke.sh "$(uv python find 3.9)"
