version: 2
updates:
  # The workflow's actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Dev tools only (ruff, pytest, fonttools): the runtime has no dependencies. pytest
  # and fonttools are limited to Python 3.10+ in pyproject.toml, so raising their
  # minimums can't break the 3.9 resolution.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
